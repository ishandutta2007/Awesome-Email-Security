<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #334155; stroke-width: 1; opacity: 0.25; }
    
    /* Background animated elements */
    .pulse-circle {
      fill: none;
      stroke: #6366f1;
      stroke-width: 1.5;
      opacity: 0.3;
      animation: pulse 6s infinite alternate ease-in-out;
    }
    
    .wave-line {
      fill: none;
      stroke: #0284c7;
      stroke-width: 2;
      opacity: 0.2;
      stroke-dasharray: 10 15;
      animation: dash 30s linear infinite;
    }

    @keyframes pulse {
      0% { r: 50px; opacity: 0.1; }
      100% { r: 180px; opacity: 0.35; }
    }

    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }

    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: url(#titleGrad);
    }

    .banner-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }

    .shield-icon {
      fill: #818cf8;
      filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.5));
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" class="bg" rx="16" />

  <!-- Subtle Grid Pattern in background -->
  <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
  <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
  <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
  <line x1="200" y1="0" x2="200" y2="300" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="300" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="300" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="300" class="grid-line" />
  <line x1="1000" y1="0" x2="1000" y2="300" class="grid-line" />

  <!-- Background Dynamic / Animated Visual Elements -->
  <circle cx="1050" cy="150" r="100" class="pulse-circle" />
  <circle cx="150" cy="80" r="60" class="pulse-circle" style="animation-delay: -3s;" />

  <path d="M -100 220 Q 300 100 700 250 T 1300 150" class="wave-line" />
  <path d="M -100 80 Q 400 280 800 120 T 1300 220" class="wave-line" style="animation-duration: 45s;" />

  <!-- Decorative Shield Icon Background Element -->
  <g transform="translate(980, 75) scale(2.5)" opacity="0.15">
    <path class="shield-icon" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8System1z"/>
  </g>

  <!-- Foreground Foreground Content (Title & Subtitle) -->
  <g transform="translate(80, 120)">
    <!-- Email Security Lock Badge -->
    <g transform="translate(0, -50)">
      <rect x="0" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🛡️ EMAIL SECURITY</text>
    </g>
    
    <text x="0" y="30" class="banner-title">Awesome Email Security 📧✨</text>
    <text x="0" y="75" class="banner-subtitle">Curated SaaS Platforms, Open-Source Tools &amp; Defensive Frameworks</text>
  </g>
</svg>
